# dynamic arguments for portability
sample:
  accession: "SRR25083113"

  # MANUAL OVERRIDE: skips ena portal api lookup when both urls present, use when ena api
  # down or accession metadata record broken. leave commented out for auto ena lookup
  # fastq_url_r1: "https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR250/013/SRR25083113/SRR25083113_1.fastq.gz"
  # fastq_url_r2: "https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR250/013/SRR25083113/SRR25083113_2.fastq.gz"

  # optional checksums for above, verified after download if provided
  # left blank here since ena's api (the normal checksum source) is down;
  # retrieve from ena or skip verification by leaving blank
  # fastq_md5_r1: ""
  # fastq_md5_r2: ""


reference:
  # label for files on disk, used in resources/reference/<name>.fa
  name: "ecoli_o157h7_edl933"
  # refseq genomic fasta, gzip compressed
  url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/006/665/GCF_000006665.1_ASM666v1/GCF_000006665.1_ASM666v1_genomic.fna.gz"


trimming:
  adapter_type: "TruSeq3-PE"
  adapter_url: "https://raw.githubusercontent.com/usadellab/Trimmomatic/main/adapters/TruSeq3-PE.fa"


decontamination:
  # bbduk built-in reference keyword
  # examples: phix, lambda, adapters, artifacts
  spike_ins: "phix"


alignment:
  # Assign platform (PL) and unit/flowcell (PU) globally
  read_group_template: "@RG\\tID:{sample}\\tPL:illumina\\tPU:unit1\\tSM:{sample}"


variant_calling:
  # genome ploidy: 1 for bacteria, haploid calling avoids false heterozygous calls
  ploidy: 1
  # minimum base quality for a base to be considered in pileup
  min_base_quality: 20
  # minimum mapping quality for a read to be included
  min_map_quality: 20
  # hard-filter: minimum variant quality score (QUAL field)
  min_variant_quality: 30
  # hard-filter: minimum read depth at a variant site
  min_depth: 10
  # min fraction reads supporting alt allele, haploid so should be near 1
  min_allele_fraction: 0.8


# set to local specs
threads: 10
